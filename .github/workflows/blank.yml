name: Refresh contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/blank.yml

permissions:
  contents: read

concurrency:
  group: profile-contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23076de5&color_dots=%23e9f1fa,%23a6dcff,%235fb9fb,%232d8de8,%230b57bd
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffdf75&color_dots=%23121f36,%231c416d,%232364a3,%232f96d4,%235bd9fb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Respect reduced-motion preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('dist').glob('*.svg'):
              svg = path.read_text()
              assert '</svg>' in svg, f'Invalid SVG: {path}'
              style = '<style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>'
              path.write_text(svg.replace('</svg>', style + '</svg>'))
          PY

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
