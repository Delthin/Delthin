name: Refresh recent public projects

on:
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/recent-work.yml
      - scripts/update-recent.mjs
      - scripts/update-recent.test.mjs

permissions:
  contents: read

concurrency:
  group: profile-recent-work
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the current profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check the updater
        run: node --test scripts/update-recent.test.mjs

      - name: Read public repository activity
        run: node scripts/update-recent.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changes when project data has changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Recent projects are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "chore: refresh recent public projects"
          git push origin HEAD:main
